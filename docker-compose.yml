services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoe
      POSTGRES_PASSWORD: shoe
      POSTGRES_DB: shoe
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoe -d shoe"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/buinam2k4/teamwork_2:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://shoe:shoe@db:5432/shoe
      SESSION_SECRET: ${SESSION_SECRET:-change-me-to-a-long-random-string}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
